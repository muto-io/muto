name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: make test-unit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binaries
        run: make build
      - name: Verify K8s integration tests compile
        run: go build -tags integration ./test/integration/k8s/...
      - name: Verify CF integration tests compile
        run: go build -tags integration ./test/integration/cf/...

  integration-test-k8s:
    name: Integration Tests (K8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Docker
        uses: docker/setup-buildx-action@v4
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Download integration test dependencies
        run: go mod download
      - name: Run K8s integration tests (k3s via testcontainers)
        run: make test-integration-k8s
        env:
          GOFLAGS: "-mod=mod"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: "/var/run/docker.sock"
        timeout-minutes: 30
      - name: Upload K8s test results
        uses: actions/upload-artifact@v4
        with:
          name: k8s-test-results
          path: test-results/k8s/
          retention-days: 30
        if: always()

  integration-test-cf:
    name: Integration Tests (Cloud Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download integration test dependencies
        run: go mod download
      - name: Run CF integration tests (mocked)
        run: make test-integration-cf
        env:
          GOFLAGS: "-mod=mod"
        timeout-minutes: 20
        continue-on-error: true
      - name: Upload CF test results
        uses: actions/upload-artifact@v4
        with:
          name: cf-test-results
          path: test-results/cf/
          retention-days: 30
        if: always()

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/muto
