name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (operator)
        id: meta-operator
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/muto-io/muto-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build & push operator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.operator
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Docker metadata (mcp)
        id: meta-mcp
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/muto-io/muto-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build & push mcp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  publish-helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          helm package deploy/helm/muto

      - name: Push Helm chart to OCI registry
        run: |
          helm push muto-*.tgz oci://ghcr.io/muto-io/charts
