---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: agentjobs.muto.io
spec:
  group: muto.io
  names:
    kind: AgentJob
    listKind: AgentJobList
    plural: agentjobs
    singular: agentjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.activeAgents
      name: ActiveAgents
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agents:
                description: |-
                  Agents lists the agent roles to spawn for this job.
                  At least one agent role is required.
                items:
                  properties:
                    command:
                      description: |-
                        Command is the task command to run on the CF runner app.
                        Required when MUTO_PLATFORM=cf.
                      type: string
                    image:
                      description: |-
                        Image is the container image to run when deploying on Kubernetes.
                        Required when MUTO_PLATFORM=k8s.
                      type: string
                    maxReplicas:
                      description: |-
                        MaxReplicas caps the number of concurrent instances for this agent role.
                        Defaults to 1 if unset.
                      format: int32
                      minimum: 1
                      type: integer
                    role:
                      description: |-
                        Role is the functional name of this agent (e.g. "coordinator", "worker").
                        Used to label pods and derive runner app names on CF.
                      type: string
                  required:
                  - role
                  type: object
                type: array
              messageBus:
                description: MessageBus configures the message bus topic for agent
                  communication.
                properties:
                  topic:
                    description: |-
                      Topic is the message bus topic prefix for agent-to-agent communication.
                      Automatically namespaced to tenant.<tenantRef>.<topic> at runtime.
                    type: string
                type: object
              tenantRef:
                description: |-
                  TenantRef is the name of the Tenant that owns this job.
                  The AgentJob must be created in the namespace defined by that Tenant.
                type: string
              trigger:
                description: Trigger defines what initiates this agent job.
                properties:
                  source:
                    description: |-
                      Source is the trigger origin — a message bus topic URL for event triggers,
                      or a cron expression for cron triggers.
                    type: string
                  type:
                    description: |-
                      Type specifies how this job is triggered.
                      event: triggered by an incoming message on the source topic.
                      cron: triggered on a schedule (source is a cron expression).
                      manual: triggered explicitly via the API or MCP tool.
                    enum:
                    - event
                    - cron
                    - manual
                    type: string
                required:
                - type
                type: object
              ttlAfterCompletion:
                description: |-
                  TTLAfterCompletion is the number of seconds to wait after the job
                  reaches a terminal phase (Succeeded or Failed) before deleting it
                  and all associated pods. 0 means no automatic cleanup.
                format: int32
                minimum: 0
                type: integer
            required:
            - agents
            - tenantRef
            - trigger
            type: object
          status:
            properties:
              activeAgents:
                description: ActiveAgents is the count of currently running agent
                  instances.
                format: int32
                type: integer
              completedAt:
                description: CompletedAt is the time the job reached a terminal phase.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase is the current lifecycle phase of the AgentJob.
                  Pending: job created, agents not yet spawned.
                  Running: agents are active.
                  Succeeded: all agents completed successfully.
                  Failed: one or more agents failed.
                  Terminating: cleanup in progress.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                - Terminating
                type: string
              startedAt:
                description: StartedAt is the time the job transitioned to Running.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
