{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "muto.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "muto.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: muto.rules
      rules:
        - alert: MutoReconciliationErrorRateHigh
          expr: |
            sum(rate(muto_reconciliations_total{result="error"}[5m])) by (reconciler)
              / sum(rate(muto_reconciliations_total[5m])) by (reconciler) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High reconcile error rate for {{ "{{" }} $labels.reconciler {{ "}}" }}"
            description: >-
              More than 10% of {{ "{{" }} $labels.reconciler {{ "}}" }} reconcile calls have
              failed over the last 5 minutes.
        - alert: MutoJobFailureRateHigh
          expr: |
            sum(rate(muto_jobs_total{status="failed"}[15m])) by (tenant)
              / sum(rate(muto_jobs_total[15m])) by (tenant) > 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High AgentJob failure rate for tenant {{ "{{" }} $labels.tenant {{ "}}" }}"
            description: >-
              More than 25% of AgentJobs for tenant {{ "{{" }} $labels.tenant {{ "}}" }} have
              ended in Failed over the last 15 minutes.
        - alert: MutoJobQueueBacklogGrowing
          expr: muto_job_queue_depth > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "AgentJob queue backlog for tenant {{ "{{" }} $labels.tenant {{ "}}" }}"
            description: >-
              Tenant {{ "{{" }} $labels.tenant {{ "}}" }} has had AgentJobs stuck in Running
              for more than 30 minutes ({{ "{{" }} $value {{ "}}" }} jobs).
        - alert: MutoNoReconciliationActivity
          expr: sum(rate(muto_reconciliations_total[15m])) == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "muto-operator has stopped reconciling"
            description: >-
              No reconcile calls of any kind have been observed in the last 15 minutes.
              The operator may be stuck, crashed, or disconnected from the API server.
{{- end }}
