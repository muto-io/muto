openapi: 3.0.3
info:
  title: Muto Agent Scheduler — CRD API Reference
  description: |
    OpenAPI 3.0 schemas for Muto's Kubernetes custom resources (muto.io/v1alpha1).

    These schemas are extracted from the CRD manifests generated by controller-gen.
    They are the authoritative validation rules applied by the Kubernetes API server
    when creating or updating Muto resources.

    **Usage with kubectl:**
    ```
    kubectl explain agentjob.spec
    kubectl explain agentjob.spec.agents
    kubectl explain tenant.spec.isolationTier
    ```
  version: v1alpha1
  license:
    name: Apache-2.0
    url: https://github.com/muto-io/muto/blob/main/LICENSE
  contact:
    url: https://github.com/muto-io/muto

components:
  schemas:

    # -------------------------------------------------------------------------
    # Tenant — cluster-scoped, defines a scheduling tenant and its isolation
    # -------------------------------------------------------------------------
    Tenant:
      type: object
      properties:
        apiVersion:
          type: string
          enum: ["muto.io/v1alpha1"]
        kind:
          type: string
          enum: ["Tenant"]
        metadata:
          type: object
        spec:
          $ref: '#/components/schemas/TenantSpec'
        status:
          $ref: '#/components/schemas/TenantStatus'

    TenantSpec:
      type: object
      required: [namespace, isolationTier]
      properties:
        namespace:
          type: string
          description: |
            Kubernetes namespace where agent pods for this tenant run.
            The TenantReconciler creates this namespace if it does not exist.
        isolationTier:
          type: string
          enum: [shared, dedicated]
          description: |
            Controls how strictly this tenant is isolated from others.
            - shared: tenant shares the controller's message bus infrastructure.
            - dedicated: tenant gets its own message bus instance (NATS or Kafka StatefulSet).
        messageBus:
          $ref: '#/components/schemas/TenantBusSpec'

    TenantBusSpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [nats, kafka]
          description: |
            Selects the message bus implementation.
            - nats: NATS JetStream — lightweight, low-latency, suited for simple agent tasks.
            - kafka: Apache Kafka — high-throughput, durable, suited for complex agent pipelines.
        dedicated:
          type: boolean
          description: |
            Provisions a per-tenant message bus instance in the tenant namespace.
            Only applicable when the parent Tenant has isolationTier: dedicated.

    TenantStatus:
      type: object
      properties:
        ready:
          type: boolean
          description: |
            True once the tenant namespace and RBAC have been provisioned
            and the message bus (if dedicated) is running.

    # -------------------------------------------------------------------------
    # AgentJob — namespaced, the unit of agent work
    # -------------------------------------------------------------------------
    AgentJob:
      type: object
      properties:
        apiVersion:
          type: string
          enum: ["muto.io/v1alpha1"]
        kind:
          type: string
          enum: ["AgentJob"]
        metadata:
          type: object
        spec:
          $ref: '#/components/schemas/AgentJobSpec'
        status:
          $ref: '#/components/schemas/AgentJobStatus'

    AgentJobSpec:
      type: object
      required: [tenantRef, trigger, agents]
      properties:
        tenantRef:
          type: string
          description: |
            Name of the Tenant that owns this job.
            The AgentJob must be created in the namespace defined by that Tenant.
        trigger:
          $ref: '#/components/schemas/TriggerSpec'
        agents:
          type: array
          description: Agent roles to spawn for this job. At least one is required.
          items:
            $ref: '#/components/schemas/AgentRoleSpec'
        messageBus:
          $ref: '#/components/schemas/JobBusSpec'
        ttlAfterCompletion:
          type: integer
          format: int32
          minimum: 0
          description: |
            Seconds to wait after the job reaches a terminal phase (Succeeded or Failed)
            before deleting it and all associated pods. 0 means no automatic cleanup.

    TriggerSpec:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [event, cron, manual]
          description: |
            How this job is triggered.
            - event: triggered by an incoming message on the source topic.
            - cron: triggered on a schedule (source is a cron expression).
            - manual: triggered explicitly via the API or MCP tool.
        source:
          type: string
          description: |
            Trigger origin — a message bus topic URL for event triggers,
            or a cron expression for cron triggers.

    AgentRoleSpec:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: |
            Functional name of this agent (e.g. "coordinator", "worker").
            Used to label pods and derive runner app names on CF.
        image:
          type: string
          description: |
            Container image to run when deploying on Kubernetes (MUTO_PLATFORM=k8s).
        command:
          type: string
          description: |
            Task command to run on the CF runner app (MUTO_PLATFORM=cf).
        maxReplicas:
          type: integer
          format: int32
          minimum: 1
          description: |
            Maximum number of concurrent agent instances for this role. Defaults to 1.

    JobBusSpec:
      type: object
      properties:
        topic:
          type: string
          description: |
            Message bus topic prefix for agent-to-agent communication.
            Automatically namespaced to tenant.<tenantRef>.<topic> at runtime.

    AgentJobStatus:
      type: object
      properties:
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Terminating]
          description: |
            Current lifecycle phase.
            - Pending: job created, agents not yet spawned.
            - Running: agents are active.
            - Succeeded: all agents completed successfully.
            - Failed: one or more agents failed.
            - Terminating: cleanup in progress, pods being deleted.
        activeAgents:
          type: integer
          format: int32
          description: Count of currently running agent instances.
        startedAt:
          type: string
          format: date-time
          description: Time the job transitioned to Running.
        completedAt:
          type: string
          format: date-time
          description: Time the job reached a terminal phase.

    # -------------------------------------------------------------------------
    # AgentFleet — namespaced, groups related AgentJobs
    # -------------------------------------------------------------------------
    AgentFleet:
      type: object
      properties:
        apiVersion:
          type: string
          enum: ["muto.io/v1alpha1"]
        kind:
          type: string
          enum: ["AgentFleet"]
        metadata:
          type: object
        spec:
          $ref: '#/components/schemas/AgentFleetSpec'
        status:
          $ref: '#/components/schemas/AgentFleetStatus'

    AgentFleetSpec:
      type: object
      required: [tenantRef]
      properties:
        tenantRef:
          type: string
          description: Name of the Tenant that owns this fleet.
        jobRefs:
          type: array
          items:
            type: string
          description: |
            Names of AgentJob resources that belong to this fleet.
            Fleet-level operations (e.g. cancel) apply to all listed jobs.

    AgentFleetStatus:
      type: object
      properties:
        totalJobs:
          type: integer
          format: int32
          description: Total number of AgentJobs in this fleet.
        runningJobs:
          type: integer
          format: int32
          description: Number of AgentJobs currently in Running phase.
        completedJobs:
          type: integer
          format: int32
          description: Number of AgentJobs in Succeeded or Failed phase.
